spring.application.name=farm
server.port=${PORT:8080}

# Python fleet simulator service (agtech _agent/api_server.py)
sim.service.url=${SIM_SERVICE_URL:http://127.0.0.1:8765}
sim.service.connect-timeout=3s
# The LLM assessment agent can take a while; everything else returns quickly.
sim.service.read-timeout=180s

# Comma-separated origins allowed to call /api directly (the Vite dev proxy avoids CORS).
farm.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
